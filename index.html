<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kryze Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            touch-action: manipulation;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            box-sizing: border-box;
        }
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 15px;
            margin: 0;
            overflow-y: auto;
        }
        .balance-card {
            background: #1e293b;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            border: 1px solid #334155;
        }
        .coin-amount {
            font-size: 32px;
            font-weight: bold;
            color: #f59e0b;
        }
        .tap-btn {
            background: radial-gradient(circle, #f59e0b 0%, #d97706 100%);
            width: 160px;
            height: 160px;
            border-radius: 50%;
            border: 4px solid #fef3c7;
            color: white;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.4);
            margin: 15px auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .tap-btn:active {
            transform: scale(0.95);
        }
        .miners-title {
            text-align: left;
            margin: 15px 0 8px 5px;
            font-size: 18px;
            color: #cbd5e1;
        }
        .action-card {
            background: #1e293b;
            margin: 10px 0;
            padding: 12px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #334155;
            text-align: left;
        }
        .miner-info {
            line-height: 1.4;
        }
        .miner-name {
            font-size: 15px;
            font-weight: bold;
            color: #f8fafc;
        }
        .miner-sub {
            font-size: 12px;
            color: #94a3b8;
        }
        button.btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        button.btn:active {
            opacity: 0.8;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            -webkit-user-select: text;
            user-select: text;
        }
    </style>
</head>
<body>

    <div class="balance-card">
        <div>Balansingiz:</div>
        <div class="coin-amount" id="balance">0</div>
        <small>Mining tezligi: <span id="cps">0</span> koin/sek</small>
    </div>

    <div class="tap-btn" onclick="tapCoin()">TAP!</div>

    <div class="miners-title">⚡ Maynerlar do'koni</div>

    <!-- Lv.1 Miner -->
    <div class="action-card">
        <div class="miner-info">
            <div class="miner-name">🔹 Kichik Mayner (Lv.<span id="m1_count">0</span>)</div>
            <div class="miner-sub">+1 koin/sek</div>
            <div class="miner-sub">Narxi: <strong style="color: #f59e0b;"><span id="m1_price">50</span></strong> koin</div>
        </div>
        <button class="btn" onclick="buyMiner(1)">Sotib olish</button>
    </div>

    <!-- Lv.2 Miner -->
    <div class="action-card">
        <div class="miner-info">
            <div class="miner-name">🔸 O'rta Mayner (Lv.<span id="m2_count">0</span>)</div>
            <div class="miner-sub">+12 koin/sek</div>
            <div class="miner-sub">Narxi: <strong style="color: #f59e0b;"><span id="m2_price">500</span></strong> koin</div>
        </div>
        <button class="btn" onclick="buyMiner(2)">Sotib olish</button>
    </div>

    <!-- Lv.3 Miner -->
    <div class="action-card">
        <div class="miner-info">
            <div class="miner-name">🚀 Katta Mayner (Lv.<span id="m3_count">0</span>)</div>
            <div class="miner-sub">+80 koin/sek</div>
            <div class="miner-sub">Narxi: <strong style="color: #f59e0b;"><span id="m3_price">3000</span></strong> koin</div>
        </div>
        <button class="btn" onclick="buyMiner(3)">Sotib olish</button>
    </div>

    <div class="balance-card" style="margin-top: 20px;">
        <h3>Pulni chiqarish</h3>
        <input type="text" id="cardInput" placeholder="Karta/Hamyon raqami">
        <button class="btn" style="width: 100%; margin-top: 10px; background: #16a34a;" onclick="withdraw()">Chiqarib olishga so'rov</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let balance = parseInt(localStorage.getItem('kryze_balance')) || 0;
        let lastTime = parseInt(localStorage.getItem('kryze_last_time')) || 0;

        // Maynerlar darajalari va narxlari
        let miners = {
            1: { count: parseInt(localStorage.getItem('kryze_m1')) || 0, basePrice: 50, cps: 1, mult: 1.2 },
            2: { count: parseInt(localStorage.getItem('kryze_m2')) || 0, basePrice: 500, cps: 12, mult: 1.25 },
            3: { count: parseInt(localStorage.getItem('kryze_m3')) || 0, basePrice: 3000, cps: 80, mult: 1.3 }
        };

        // Joriy Mayner narxini hisoblash
        function getPrice(type) {
            let m = miners[type];
            return Math.floor(m.basePrice * Math.pow(m.mult, m.count));
        }

        // Umumiy CPS (Mining tezligi)ni hisoblash
        function getTotalCPS() {
            return (miners[1].count * miners[1].cps) +
                   (miners[2].count * miners[2].cps) +
                   (miners[3].count * miners[3].cps);
        }

        // Oflayn daromadni hisoblash
        function initOfflineEarnings() {
            let now = Date.now();
            let totalCps = getTotalCPS();
            if (totalCps > 0 && lastTime > 0) {
                let secondsPassed = Math.floor((now - lastTime) / 1000);
                if (secondsPassed >= 3) {
                    let earned = secondsPassed * totalCps;
                    balance += earned;
                    updateDisplay();
                    saveLocalState();
                    setTimeout(() => {
                        alert(`Siz yo'qligingizda maynerlaringiz ${earned} koin ishlab berdi! 🚀`);
                    }, 500);
                }
            }
            updateDisplay();
        }

        // Local xotiraga saqlash
        function saveLocalState() {
            localStorage.setItem('kryze_balance', balance);
            localStorage.setItem('kryze_m1', miners[1].count);
            localStorage.setItem('kryze_m2', miners[2].count);
            localStorage.setItem('kryze_m3', miners[3].count);
            localStorage.setItem('kryze_last_time', Date.now());
        }

        function tapCoin() {
            balance += 1;
            updateDisplay();
            saveLocalState();
        }

        function buyMiner(type) {
            let price = getPrice(type);
            if (balance >= price) {
                balance -= price;
                miners[type].count += 1;
                updateDisplay();
                saveLocalState();
            } else {
                alert("Mablag' yetarli emas!");
            }
        }

        function updateDisplay() {
            document.getElementById('balance').innerText = balance;
            document.getElementById('cps').innerText = getTotalCPS();

            // Maynerlar ma'lumotlarini ekranda yangilash
            document.getElementById('m1_count').innerText = miners[1].count;
            document.getElementById('m1_price').innerText = getPrice(1);

            document.getElementById('m2_count').innerText = miners[2].count;
            document.getElementById('m2_price').innerText = getPrice(2);

            document.getElementById('m3_count').innerText = miners[3].count;
            document.getElementById('m3_price').innerText = getPrice(3);
        }

        // Onlayn avto-mining
        setInterval(() => {
            let totalCps = getTotalCPS();
            if (totalCps > 0) {
                balance += totalCps;
                updateDisplay();
                saveLocalState();
            }
        }, 1000);

        window.addEventListener('pagehide', saveLocalState);
        window.addEventListener('beforeunload', saveLocalState);

        initOfflineEarnings();

        function withdraw() {
            let card = document.getElementById('cardInput').value;
            if (card.length < 5) {
                alert("Karta raqamini to'g'ri kiriting!");
                return;
            }
            tg.sendData(JSON.stringify({ action: "withdraw", amount: balance, card: card }));
            alert("So'rov yuborildi! Balans: " + balance);
        }
    </script>
</body>
</html>
