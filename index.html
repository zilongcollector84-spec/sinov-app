<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kryze Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            touch-action: manipulation;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            box-sizing: border-box;
        }
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 15px;
            margin: 0;
            overflow-y: auto;
        }
        .balance-card {
            background: #1e293b;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            border: 1px solid #334155;
        }
        .coin-amount {
            font-size: 32px;
            font-weight: bold;
            color: #f59e0b;
        }
        .tap-btn {
            background: radial-gradient(circle, #f59e0b 0%, #d97706 100%);
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 4px solid #fef3c7;
            color: white;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.4);
            margin: 15px auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .tap-btn:active {
            transform: scale(0.95);
        }
        .miners-title {
            text-align: left;
            margin: 15px 0 8px 5px;
            font-size: 18px;
            color: #cbd5e1;
        }
        .category-box {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 15px;
            text-align: left;
        }
        .category-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            border-bottom: 1px solid #334155;
            padding-bottom: 8px;
        }
        .category-title {
            font-weight: bold;
            font-size: 16px;
            color: #38bdf8;
        }
        .miner-item {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 10px;
            margin-top: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .miner-info {
            font-size: 13px;
        }
        .miner-name {
            font-weight: bold;
            color: #f8fafc;
            margin-bottom: 2px;
        }
        .miner-stats {
            color: #94a3b8;
            font-size: 12px;
        }
        button.btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
        }
        button.btn-buy {
            background: #16a34a;
        }
        button.btn:active {
            opacity: 0.8;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            -webkit-user-select: text;
            user-select: text;
        }
    </style>
</head>
<body>

    <div class="balance-card">
        <div>Balansingiz:</div>
        <div class="coin-amount" id="balance">0</div>
        <small>Mining tezligi: <span id="cps">0</span> koin/sek</small>
    </div>

    <div class="tap-btn" onclick="tapCoin()">TAP!</div>

    <div class="miners-title">⚡ Maynerlar do'koni va Fermalaringiz</div>

    <!-- Kichik Maynerlar Toifasi -->
    <div class="category-box">
        <div class="category-header">
            <div class="category-title">🔹 Kichik Ferma</div>
            <button class="btn btn-buy" onclick="buyNewMiner('small')">+ Yangi sotib olish (100 koin)</button>
        </div>
        <div id="small_miners_list"></div>
    </div>

    <!-- O'rta Maynerlar Toifasi -->
    <div class="category-box">
        <div class="category-header">
            <div class="category-title">🔸 O'rta Ferma</div>
            <button class="btn btn-buy" onclick="buyNewMiner('medium')">+ Yangi sotib olish (1,000 koin)</button>
        </div>
        <div id="medium_miners_list"></div>
    </div>

    <!-- Katta Maynerlar Toifasi -->
    <div class="category-box">
        <div class="category-header">
            <div class="category-title">🚀 Katta Ferma</div>
            <button class="btn btn-buy" onclick="buyNewMiner('large')">+ Yangi sotib olish (5,000 koin)</button>
        </div>
        <div id="large_miners_list"></div>
    </div>

    <div class="balance-card" style="margin-top: 20px;">
        <h3>Pulni chiqarish</h3>
        <input type="text" id="cardInput" placeholder="Karta/Hamyon raqami">
        <button class="btn" style="width: 100%; margin-top: 10px; background: #16a34a; font-size: 14px; padding: 10px;" onclick="withdraw()">Chiqarib olishga so'rov</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let balance = parseInt(localStorage.getItem('kryze_balance')) || 0;
        let lastTime = parseInt(localStorage.getItem('kryze_last_time')) || 0;

        // Mayner turlari sozlamalari
        const config = {
            small: { name: "Kichik Mayner", buyPrice: 100, baseCps: 1, upBasePrice: 50, upMult: 1.3 },
            medium: { name: "O'rta Mayner", buyPrice: 1000, baseCps: 12, upBasePrice: 300, upMult: 1.35 },
            large: { name: "Katta Mayner", buyPrice: 5000, baseCps: 80, upBasePrice: 1500, upMult: 1.4 }
        };

        // Barcha sotib olingan maynerlar ro'yxati
        let myMiners = JSON.parse(localStorage.getItem('kryze_my_miners')) || [];

        // Maynerning joriy koin berish tezligini hisoblash
        function getMinerCPS(miner) {
            let cfg = config[miner.type];
            return cfg.baseCps * miner.level;
        }

        // Maynerni keyingi darajaga ko'tarish narxi
        function getUpgradePrice(miner) {
            let cfg = config[miner.type];
            return Math.floor(cfg.upBasePrice * Math.pow(cfg.upMult, miner.level - 1));
        }

        // Umumiy Mining Tezligi
        function getTotalCPS() {
            let total = 0;
            myMiners.forEach(m => {
                total += getMinerCPS(m);
            });
            return total;
        }

        // Yangi alohida Mayner sotib olish
        function buyNewMiner(type) {
            let cfg = config[type];
            if (balance >= cfg.buyPrice) {
                balance -= cfg.buyPrice;
                
                // Maynerga tartib raqami va nom berish
                let countOfType = myMiners.filter(m => m.type === type).length + 1;
                let newMiner = {
                    id: Date.now() + Math.random(),
                    type: type,
                    name: `${cfg.name} #${countOfType}`,
                    level: 1
                };
                
                myMiners.push(newMiner);
                saveLocalState();
                updateDisplay();
            } else {
                alert(`Mablag' yetarli emas! Narxi: ${cfg.buyPrice} koin`);
            }
        }

        // Alohida bitta maynerni Upgrade qilish (kuchaytirish)
        function upgradeMiner(id) {
            let miner = myMiners.find(m => m.id === id);
            if (!miner) return;

            let price = getUpgradePrice(miner);
            if (balance >= price) {
                balance -= price;
                miner.level += 1;
                saveLocalState();
                updateDisplay();
            } else {
                alert(`Mablag' yetarli emas! Kuchaytirish narxi: ${price} koin`);
            }
        }

        // Oflayn daromadni hisoblash
        function initOfflineEarnings() {
            let now = Date.now();
            let totalCps = getTotalCPS();
            if (totalCps > 0 && lastTime > 0) {
                let secondsPassed = Math.floor((now - lastTime) / 1000);
                if (secondsPassed >= 3) {
                    let earned = secondsPassed * totalCps;
                    balance += earned;
                    updateDisplay();
                    saveLocalState();
                    setTimeout(() => {
                        alert(`Siz yo'qligingizda maynerlaringiz ${earned} koin ishlab berdi! 🚀`);
                    }, 500);
                }
            }
            updateDisplay();
        }

        function saveLocalState() {
            localStorage.setItem('kryze_balance', balance);
            localStorage.setItem('kryze_my_miners', JSON.stringify(myMiners));
            localStorage.setItem('kryze_last_time', Date.now());
        }

        function tapCoin() {
            balance += 1;
            updateDisplay();
            saveLocalState();
        }

        function updateDisplay() {
            document.getElementById('balance').innerText = balance;
            document.getElementById('cps').innerText = getTotalCPS();

            // Maynerlar ro'yxatini toifalarga bo'lib ekranga chiqarish
            ['small', 'medium', 'large'].forEach(type => {
                let listContainer = document.getElementById(`${type}_miners_list`);
                let minersOfType = myMiners.filter(m => m.type === type);

                if (minersOfType.length === 0) {
                    listContainer.innerHTML = `<div style="font-size:12px; color:#64748b; margin-top:5px;">Hali mayner sotib olinmagan</div>`;
                } else {
                    let html = '';
                    minersOfType.forEach(m => {
                        let cps = getMinerCPS(m);
                        let upPrice = getUpgradePrice(m);
                        html += `
                            <div class="miner-item">
                                <div class="miner-info">
                                    <div class="miner-name">${m.name} (Lv.${m.level})</div>
                                    <div class="miner-stats">+${cps} koin/sek</div>
                                </div>
                                <button class="btn" onclick="upgradeMiner(${m.id})">Kuchaytirish (${upPrice} koin)</button>
                            </div>
                        `;
                    });
                    listContainer.innerHTML = html;
                }
            });
        }

        setInterval(() => {
            let totalCps = getTotalCPS();
            if (totalCps > 0) {
                balance += totalCps;
                updateDisplay();
                saveLocalState();
            }
        }, 1000);

        window.addEventListener('pagehide', saveLocalState);
        window.addEventListener('beforeunload', saveLocalState);

        initOfflineEarnings();

        function withdraw() {
            let card = document.getElementById('cardInput').value;
            if (card.length < 5) {
                alert("Karta raqamini to'g'ri kiriting!");
                return;
            }
            tg.sendData(JSON.stringify({ action: "withdraw", amount: balance, card: card }));
            alert("So'rov yuborildi! Balans: " + balance);
        }
    </script>
</body>
</html>
