<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kryze Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            touch-action: manipulation;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            box-sizing: border-box;
        }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 15px;
            padding-bottom: 90px;
            margin: 0;
            overflow-y: auto;
        }
        
        .balance-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            padding: 18px;
            border-radius: 16px;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }
        .coin-amount {
            font-size: 34px;
            font-weight: 800;
            color: #38bdf8;
            text-shadow: 0 0 12px rgba(56, 189, 248, 0.5);
        }
        .tap-btn {
            background: radial-gradient(circle, #38bdf8 0%, #1e40af 100%);
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 4px solid #93c5fd;
            color: white;
            font-size: 26px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.5);
            margin: 40px auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .tap-btn:active {
            transform: scale(0.95);
        }
        
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }

        .card {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.8) 0%, rgba(15, 23, 42, 0.9) 100%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 12px 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 15px;
            text-align: left;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        .card-img {
            width: 65px;
            height: 65px;
            object-fit: contain;
            filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.3));
            flex-shrink: 0;
        }
        .card-info {
            flex-grow: 1;
            font-size: 13px;
        }
        .card-title {
            font-weight: 700;
            color: #f8fafc;
            font-size: 16px;
            margin-bottom: 4px;
        }
        .card-sub {
            color: #94a3b8;
            font-size: 12px;
            margin-bottom: 2px;
        }

        button.btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            box-shadow: 0 0 10px rgba(37, 99, 235, 0.4);
        }
        button.btn-buy {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.3);
        }

        .leader-item {
            background: rgba(30, 41, 59, 0.6);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .rank {
            font-weight: bold;
            font-size: 16px;
            width: 30px;
            color: #f59e0b;
        }

        .navbar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            z-index: 100;
        }
        .nav-item {
            color: #64748b;
            font-size: 11px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .nav-item.active {
            color: #38bdf8;
            font-weight: bold;
        }
        .nav-icon {
            font-size: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="balance-card">
        <div style="color: #94a3b8; font-size: 13px;">Balansingiz:</div>
        <div class="coin-amount" id="balance">0</div>
        <small style="color: #cbd5e1;">Mining tezligi: <span id="cps" style="color:#38bdf8; font-weight:bold;">0</span> koin/sek</small>
    </div>

    <!-- 1. BOSH SAHIFA -->
    <div id="tab-home" class="tab-content active">
        <div class="tap-btn" onclick="tapCoin()">TAP!</div>
    </div>

    <!-- 2. DO'KON -->
    <div id="tab-shop" class="tab-content">
        <h3 style="text-align: left; color: #f8fafc; margin-bottom: 12px;">⚡ Maynerlar Do'koni</h3>
        <div id="shop_list"></div>
    </div>

    <!-- 3. MENING MAYNERLARIM -->
    <div id="tab-my-miners" class="tab-content">
        <h3 style="text-align: left; color: #f8fafc; margin-bottom: 12px;">🚜 Mening Maynerlarim</h3>
        <div id="my_miners_list"></div>
    </div>

    <!-- 4. REYTING -->
    <div id="tab-leaderboard" class="tab-content">
        <h3 style="text-align: left; color: #f8fafc; margin-bottom: 12px;">🏆 Top 100 O'yinchilar</h3>
        <div id="leaderboard_list">Yuklanmoqda...</div>
    </div>

    <!-- 5. VAZIFALAR -->
    <div id="tab-tasks" class="tab-content">
        <h3 style="text-align: left; color: #f8fafc; margin-bottom: 12px;">📋 Vazifalar</h3>
        <div class="balance-card" style="text-align: left;">
            <div style="font-weight: bold; font-size: 16px; color: #38bdf8; margin-bottom: 5px;">🎁 Promokod kiritish</div>
            <div style="color: #94a3b8; font-size: 12px;">Maxsus promokodni kiriting va bepul koinlarga ega bo'ling!</div>
            <input type="text" id="promoInput" placeholder="Promokodni yozing...">
            <button class="btn" style="width: 100%; margin-top: 10px; background: #16a34a; padding: 10px; font-size: 14px;" onclick="claimPromo()">Aktivlashtirish</button>
        </div>
    </div>

    <!-- NAVBAR -->
    <div class="navbar">
        <div class="nav-item active" onclick="switchTab('home', this)">
            <span class="nav-icon">🪙</span>
            <span>Bosh sahifa</span>
        </div>
        <div class="nav-item" onclick="switchTab('shop', this)">
            <span class="nav-icon">🛒</span>
            <span>Do'kon</span>
        </div>
        <div class="nav-item" onclick="switchTab('my-miners', this)">
            <span class="nav-icon">🚜</span>
            <span>Maynerlarim</span>
        </div>
        <div class="nav-item" onclick="switchTab('leaderboard', this)">
            <span class="nav-icon">🏆</span>
            <span>Reyting</span>
        </div>
        <div class="nav-item" onclick="switchTab('tasks', this)">
            <span class="nav-icon">📋</span>
            <span>Vazifalar</span>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        try { tg.expand(); } catch(e){}

        // SUPABASE CLIENT
        let supabaseClient = null;
        try {
            if (window.supabase) {
                const SUPABASE_URL = "https://sxfbkkdulcxirrndwomg.supabase.co";
                const SUPABASE_ANON_KEY = "Sb_publishable_xqv6g1v0Gixqb-HhbcqxJQ_9doBO2x8";
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
        } catch(e) { console.log("Supabase error", e); }

        let user = tg.initDataUnsafe?.user || { id: 999999, first_name: "O'yinchi", username: "player" };

        let balance = parseFloat(localStorage.getItem('kryze_balance')) || 0;
        let lastTime = parseInt(localStorage.getItem('kryze_last_time')) || 0;
        let usedPromos = JSON.parse(localStorage.getItem('kryze_used_promos')) || [];

        const shopConfig = [
            { id: 1, name: "Kichik Mayner", price: 10000, cps: 0.1, image: "https://cdn-icons-png.flaticon.com/512/6298/6298533.png" },
            { id: 2, name: "O'rta Mayner", price: 25000, cps: 0.3, image: "https://cdn-icons-png.flaticon.com/512/6298/6298583.png" },
            { id: 3, name: "Katta Mayner", price: 50000, cps: 0.7, image: "https://cdn-icons-png.flaticon.com/512/2091/2091665.png" },
            { id: 4, name: "Super Mayner", price: 100000, cps: 1.5, image: "https://cdn-icons-png.flaticon.com/512/3135/3135706.png" }
        ];

        let minerCounts = JSON.parse(localStorage.getItem('kryze_miner_counts')) || { 1: 0, 2: 0, 3: 0, 4: 0 };

        function switchTab(tabName, el) {
            let tabs = document.querySelectorAll('.tab-content');
            let navs = document.querySelectorAll('.nav-item');
            
            tabs.forEach(tab => tab.classList.remove('active'));
            navs.forEach(nav => nav.classList.remove('active'));

            let targetTab = document.getElementById('tab-' + tabName);
            if (targetTab) targetTab.classList.add('active');
            if (el) el.classList.add('active');

            if (tabName === 'shop') renderShop();
            if (tabName === 'my-miners') renderMyMiners();
            if (tabName === 'leaderboard') loadLeaderboard();
        }

        function getTotalCPS() {
            let total = 0;
            shopConfig.forEach(item => {
                let count = minerCounts[item.id] || 0;
                total += count * item.cps;
            });
            return parseFloat(total.toFixed(2));
        }

        function buyMiner(shopId) {
            let item = shopConfig.find(s => s.id === shopId);
            if (!item) return;

            if (balance >= item.price) {
                balance -= item.price;
                minerCounts[shopId] = (minerCounts[shopId] || 0) + 1;

                saveLocalState();
                updateDisplay();
                renderShop();
                alert(item.name + " sotib olindi! 🎉");
            } else {
                alert("Mablag' yetarli emas! Narxi: " + item.price.toLocaleString() + " koin");
            }
        }

        function renderShop() {
            let container = document.getElementById('shop_list');
            let html = '';
            shopConfig.forEach(item => {
                let owned = minerCounts[item.id] || 0;
                html += '<div class="card">' +
                    '<img src="' + item.image + '" class="card-img" alt="">' +
                    '<div class="card-info">' +
                        '<div class="card-title">' + item.name + '</div>' +
                        '<div class="card-sub">Tezlik: <strong style="color: #38bdf8;">+' + item.cps + ' koin/sek</strong></div>' +
                        '<div class="card-sub">Narxi: <strong style="color: #f59e0b;">' + item.price.toLocaleString() + '</strong> koin</div>' +
                        '<div class="card-sub" style="color: #4ade80; margin-top:2px;">Sizda bor: <strong>' + owned + ' dona</strong></div>' +
                    '</div>' +
                    '<button class="btn btn-buy" onclick="buyMiner(' + item.id + ')">Olish</button>' +
                '</div>';
            });
            container.innerHTML = html;
        }

        function renderMyMiners() {
            let container = document.getElementById('my_miners_list');
            let hasAnyMiner = false;
            let html = '';

            shopConfig.forEach(item => {
                let count = minerCounts[item.id] || 0;
                if (count > 0) {
                    hasAnyMiner = true;
                    let totalCps = parseFloat((count * item.cps).toFixed(2));
                    html += '<div class="card">' +
                        '<img src="' + item.image + '" class="card-img" alt="">' +
                        '<div class="card-info">' +
                            '<div class="card-title">' + item.name + '</div>' +
                            '<div class="card-sub">Soni: <strong style="color: #f59e0b;">' + count + ' dona</strong></div>' +
                            '<div class="card-sub">Umumiy tezlik: <strong style="color: #38bdf8;">+' + totalCps + ' koin/sek</strong></div>' +
                        '</div>' +
                        '<span style="font-size: 11px; background: rgba(52, 211, 153, 0.2); border: 1px solid #34d399; padding: 4px 8px; border-radius: 6px; color: #34d399;">Faol</span>' +
                    '</div>';
                }
            });

            if (!hasAnyMiner) {
                container.innerHTML = '<div class="balance-card" style="color: #64748b;">Sizda hali hech qanday mayner yo\'q. Do\'kondan sotib oling!</div>';
            } else {
                container.innerHTML = html;
            }
        }

        async function syncWithDatabase() {
            if (!supabaseClient || !user || !user.id) return;
            try {
                await supabaseClient.from('users').upsert({
                    telegram_id: user.id,
                    first_name: user.first_name || 'Foydalanuvchi',
                    username: user.username || '',
                    balance: parseFloat(balance.toFixed(1)),
                    cps: getTotalCPS(),
                    miner_counts: minerCounts
                }, { onConflict: 'telegram_id' });
            } catch (err) {}
        }

        async function loadLeaderboard() {
            let container = document.getElementById('leaderboard_list');
            container.innerHTML = "Yuklanmoqda...";

            if (!supabaseClient) {
                container.innerHTML = "Lokal rejimda ishlamoqda.";
                return;
            }

            try {
                let res = await supabaseClient
                    .from('users')
                    .select('first_name, balance, cps')
                    .order('balance', { ascending: false })
                    .limit(100);

                if (res.error || !res.data) {
                    container.innerHTML = "Reyting yuklanmadi.";
                    return;
                }

                let html = '';
                res.data.forEach((item, index) => {
                    let medal = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : '#' + (index + 1);
                    html += '<div class="leader-item">' +
                        '<div style="display: flex; align-items: center; gap: 10px;">' +
                            '<span class="rank">' + medal + '</span>' +
                            '<div style="text-align: left;">' +
                                '<div style="font-weight: bold; color: #f8fafc;">' + (item.first_name || 'O\'yinchi') + '</div>' +
                                '<div style="font-size: 11px; color: #94a3b8;">' + item.cps + ' koin/sek</div>' +
                            '</div>' +
                        '</div>' +
                        '<div style="font-weight: bold; color: #38bdf8;">' + Math.floor(item.balance).toLocaleString() + ' 🪙</div>' +
                    '</div>';
                });

                container.innerHTML = html || "Hali o'yinchilar yo'q.";
            } catch (err) {
                container.innerHTML = "Reyting olishda xatolik.";
            }
        }

        function claimPromo() {
            let code = document.getElementById('promoInput').value.trim().toLowerCase();
            if (!code) {
                alert("Promokodni kiriting!");
                return;
            }

            if (code === 'pull') {
                if (usedPromos.includes('pull')) {
                    alert("Siz bu promokoddan foydalanib bo'lgansiz!");
                } else {
                    balance += 100000;
                    usedPromos.push('pull');
                    saveLocalState();
                    updateDisplay();
                    document.getElementById('promoInput').value = '';
                    alert("Tabriklaymiz! 100,000 koin hisobingizga qo'shildi! 🎉");
                }
            } else {
                alert("Noto'g'ri promokod kiritildi!");
            }
        }

        function initOfflineEarnings() {
            let now = Date.now();
            let totalCps = getTotalCPS();
            if (totalCps > 0 && lastTime > 0) {
                let secondsPassed = Math.floor((now - lastTime) / 1000);
                if (secondsPassed >= 3) {
                    let earned = parseFloat((secondsPassed * totalCps).toFixed(2));
                    balance += earned;
                    updateDisplay();
                    saveLocalState();
                    setTimeout(() => {
                        alert("Siz yo'qligingizda maynerlaringiz " + earned + " koin ishlab berdi! 🚀");
                    }, 500);
                }
            }
            updateDisplay();
        }

        function saveLocalState() {
            localStorage.setItem('kryze_balance', balance);
            localStorage.setItem('kryze_miner_counts', JSON.stringify(minerCounts));
            localStorage.setItem('kryze_used_promos', JSON.stringify(usedPromos));
            localStorage.setItem('kryze_last_time', Date.now());
            
            syncWithDatabase();
        }

        function tapCoin() {
            balance += 1;
            updateDisplay();
            saveLocalState();
        }

        function updateDisplay() {
            document.getElementById('balance').innerText = balance.toFixed(1);
            document.getElementById('cps').innerText = getTotalCPS();
        }

        setInterval(() => {
            let totalCps = getTotalCPS();
            if (totalCps > 0) {
                balance += totalCps;
                updateDisplay();
                saveLocalState();
            }
        }, 1000);

        window.addEventListener('pagehide', saveLocalState);
        window.addEventListener('beforeunload', saveLocalState);

        updateDisplay();
        initOfflineEarnings();
        syncWithDatabase();
    </script>
</body>
</html>
