<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kryze Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            touch-action: manipulation;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
            overflow: hidden;
        }
        .balance-card {
            background: #1e293b;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid #334155;
        }
        .coin-amount {
            font-size: 32px;
            font-weight: bold;
            color: #f59e0b;
        }
        .tap-btn {
            background: radial-gradient(circle, #f59e0b 0%, #d97706 100%);
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 4px solid #fef3c7;
            color: white;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.4);
            margin: 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .tap-btn:active {
            transform: scale(0.95);
        }
        .action-card {
            background: #1e293b;
            margin: 10px 0;
            padding: 12px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        button.btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
        }
        input {
            width: 90%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            -webkit-user-select: text;
            user-select: text;
        }
    </style>
</head>
<body>

    <div class="balance-card">
        <div>Balansingiz:</div>
        <div class="coin-amount" id="balance">0</div>
        <small>Mining tezligi: <span id="cps">0</span> koin/sek</small>
    </div>

    <div class="tap-btn" onclick="tapCoin()">TAP!</div>

    <div class="action-card">
        <div>
            <strong>Mayner Lv.1</strong><br>
            <small>Narxi: 50 koin (+1 koin/sek)</small>
        </div>
        <button class="btn" onclick="buyMiner()">Sotib olish</button>
    </div>

    <div class="balance-card">
        <h3>Pulni chiqarish</h3>
        <input type="text" id="cardInput" placeholder="Karta/Hamyon raqami">
        <button class="btn" style="width: 95%; margin-top: 10px; background: #16a34a;" onclick="withdraw()">Chiqarib olishga so'rov</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let balance = parseInt(localStorage.getItem('kryze_balance')) || 0;
        let cps = parseInt(localStorage.getItem('kryze_cps')) || 0;
        let lastTime = parseInt(localStorage.getItem('kryze_last_time')) || Date.now();

        // Oflayn vaqtda ishlab berilgan koinlarni hisoblash
        function checkOfflineEarnings() {
            let now = Date.now();
            let secondsPassed = Math.floor((now - lastTime) / 1000);

            if (cps > 0 && secondsPassed > 1) {
                let earned = secondsPassed * cps;
                balance += earned;
                alert(`Siz yo'qligingizda mayneringiz ${earned} koin ishlab berdi! 🚀`);
            }
            updateDisplay();
            saveLocal();
        }

        // Local xotiraga holatni va hozirgi vaqtni saqlash
        function saveLocal() {
            localStorage.setItem('kryze_balance', balance);
            localStorage.setItem('kryze_cps', cps);
            localStorage.setItem('kryze_last_time', Date.now());
        }

        // Cloud storage zaxira
        function saveCloud() {
            if (tg.CloudStorage) {
                tg.CloudStorage.setItem('kryze_balance', balance.toString());
                tg.CloudStorage.setItem('kryze_cps', cps.toString());
            }
        }

        // Bulutdan yuklash (birinchi marta ochilganda)
        if (tg.CloudStorage) {
            tg.CloudStorage.getItems(['kryze_balance', 'kryze_cps'], (err, values) => {
                if (!err) {
                    let cloudBal = parseInt(values.kryze_balance) || 0;
                    let cloudCps = parseInt(values.kryze_cps) || 0;
                    
                    if (cloudBal > balance) balance = cloudBal;
                    if (cloudCps > cps) cps = cloudCps;
                    
                    checkOfflineEarnings();
                } else {
                    checkOfflineEarnings();
                }
            });
        } else {
            checkOfflineEarnings();
        }

        function tapCoin() {
            balance += 1;
            updateDisplay();
            saveLocal();
        }

        function buyMiner() {
            if (balance >= 50) {
                balance -= 50;
                cps += 1;
                updateDisplay();
                saveLocal();
                saveCloud();
            } else {
                alert("Mablag' yetarli emas!");
            }
        }

        function updateDisplay() {
            document.getElementById('balance').innerText = balance;
            document.getElementById('cps').innerText = cps;
        }

        // Onlayn mayning (1 sekundlik intervallar bilan)
        setInterval(() => {
            if (cps > 0) {
                balance += cps;
                updateDisplay();
                saveLocal();
            }
        }, 1000);

        // Har 5 sekundda bulutga yozib turish
        setInterval(() => {
            saveCloud();
        }, 5000);

        function withdraw() {
            let card = document.getElementById('cardInput').value;
            if (card.length < 5) {
                alert("Karta raqamini to'g'ri kiriting!");
                return;
            }
            tg.sendData(JSON.stringify({ action: "withdraw", amount: balance, card: card }));
            alert("So'rov yuborildi! Balans: " + balance);
        }
    </script>
</body>
</html>
