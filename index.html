<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kryze Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            touch-action: manipulation;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            box-sizing: border-box;
        }
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 15px;
            padding-bottom: 80px;
            margin: 0;
            overflow-y: auto;
        }
        .balance-card {
            background: #1e293b;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            border: 1px solid #334155;
        }
        .coin-amount {
            font-size: 32px;
            font-weight: bold;
            color: #f59e0b;
        }
        .tap-btn {
            background: radial-gradient(circle, #f59e0b 0%, #d97706 100%);
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 4px solid #fef3c7;
            color: white;
            font-size: 26px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.4);
            margin: 30px auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .tap-btn:active {
            transform: scale(0.95);
        }
        
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }

        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-align: left;
        }
        .card-info {
            font-size: 13px;
        }
        .card-title {
            font-weight: bold;
            color: #f8fafc;
            font-size: 15px;
            margin-bottom: 4px;
        }
        .card-sub {
            color: #94a3b8;
            font-size: 12px;
        }

        button.btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
        }
        button.btn-buy {
            background: #16a34a;
        }
        button.btn:active {
            opacity: 0.8;
        }

        .navbar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #0f172a;
            border-top: 1px solid #334155;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 100;
        }
        .nav-item {
            color: #64748b;
            font-size: 11px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .nav-item.active {
            color: #38bdf8;
            font-weight: bold;
        }
        .nav-icon {
            font-size: 18px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            font-size: 14px;
            text-align: center;
            -webkit-user-select: text;
            user-select: text;
        }
    </style>
</head>
<body>

    <!-- Yuqori Balans Card -->
    <div class="balance-card">
        <div>Balansingiz:</div>
        <div class="coin-amount" id="balance">0</div>
        <small>Mining tezligi: <span id="cps">0</span> koin/sek</small>
    </div>

    <!-- 1. BOSH SAHIFA (TAP) -->
    <div id="tab-home" class="tab-content active">
        <div class="tap-btn" onclick="tapCoin()">TAP!</div>
    </div>

    <!-- 2. MAYNERLAR DO'KONI -->
    <div id="tab-shop" class="tab-content">
        <h3 style="text-align: left; color: #cbd5e1; margin-bottom: 10px;">⚡ Maynerlar Do'koni</h3>
        <div id="shop_list"></div>
    </div>

    <!-- 3. MENING MAYNERLARIM -->
    <div id="tab-my-miners" class="tab-content">
        <h3 style="text-align: left; color: #cbd5e1; margin-bottom: 10px;">🚜 Mening Maynerlarim</h3>
        <div id="my_miners_list"></div>
    </div>

    <!-- 4. VAZIFALAR (TASKS & PROMOCODE) -->
    <div id="tab-tasks" class="tab-content">
        <h3 style="text-align: left; color: #cbd5e1; margin-bottom: 10px;">📋 Vazifalar</h3>
        
        <div class="balance-card" style="text-align: left;">
            <div style="font-weight: bold; font-size: 16px; color: #38bdf8; margin-bottom: 5px;">🎁 Promokod kiritish</div>
            <div style="color: #94a3b8; font-size: 12px;">Maxsus promokodni kiriting va bepul koinlarga ega bo'ling!</div>
            <input type="text" id="promoInput" placeholder="Promokodni yozing...">
            <button class="btn" style="width: 100%; margin-top: 10px; background: #16a34a; padding: 10px; font-size: 14px;" onclick="claimPromo()">Aktivlashtirish</button>
        </div>
    </div>

    <!-- PASTKI NAVIGASIYA MENYUSI -->
    <div class="navbar">
        <div class="nav-item active" onclick="switchTab('home', this)">
            <span class="nav-icon">🪙</span>
            <span>Bosh sahifa</span>
        </div>
        <div class="nav-item" onclick="switchTab('shop', this)">
            <span class="nav-icon">🛒</span>
            <span>Do'kon</span>
        </div>
        <div class="nav-item" onclick="switchTab('my-miners', this)">
            <span class="nav-icon">🚜</span>
            <span>Maynerlarim</span>
        </div>
        <div class="nav-item" onclick="switchTab('tasks', this)">
            <span class="nav-icon">📋</span>
            <span>Vazifalar</span>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let balance = parseFloat(localStorage.getItem('kryze_balance')) || 0;
        let lastTime = parseInt(localStorage.getItem('kryze_last_time')) || 0;
        let usedPromos = JSON.parse(localStorage.getItem('kryze_used_promos')) || [];

        const shopConfig = [
            { id: 1, name: "Kichik Mayner", price: 10000, cps: 0.1 },
            { id: 2, name: "O'rta Mayner", price: 25000, cps: 0.3 },
            { id: 3, name: "Katta Mayner", price: 50000, cps: 0.7 },
            { id: 4, name: "Super Mayner", price: 100000, cps: 1.5 }
        ];

        let minerCounts = JSON.parse(localStorage.getItem('kryze_miner_counts')) || { 1: 0, 2: 0, 3: 0, 4: 0 };

        // ESKI SOTIB OLINGAN MAYNERLARNI YANGI FORMAGA O'TKAZISH (MIGRATION)
        let oldMiners = JSON.parse(localStorage.getItem('kryze_my_miners')) || [];
        if (oldMiners.length > 0) {
            oldMiners.forEach(m => {
                if (m.shopId && minerCounts[m.shopId] !== undefined) {
                    minerCounts[m.shopId] += 1;
                }
            });
            localStorage.removeItem('kryze_my_miners'); // Eskisini tozalab tashlaymiz
            localStorage.setItem('kryze_miner_counts', JSON.stringify(minerCounts));
        }

        function switchTab(tabName, el) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));

            document.getElementById(`tab-${tabName}`).classList.add('active');
            el.classList.add('active');

            if (tabName === 'shop') renderShop();
            if (tabName === 'my-miners') renderMyMiners();
        }

        function getTotalCPS() {
            let total = 0;
            shopConfig.forEach(item => {
                let count = minerCounts[item.id] || 0;
                total += count * item.cps;
            });
            return parseFloat(total.toFixed(2));
        }

        function buyMiner(shopId) {
            let item = shopConfig.find(s => s.id === shopId);
            if (!item) return;

            if (balance >= item.price) {
                balance -= item.price;
                minerCounts[shopId] = (minerCounts[shopId] || 0) + 1;

                saveLocalState();
                updateDisplay();
                renderShop();
                alert(`${item.name} sotib olindi! 🎉`);
            } else {
                alert(`Mablag' yetarli emas! Narxi: ${item.price.toLocaleString()} koin`);
            }
        }

        function renderShop() {
            let container = document.getElementById('shop_list');
            let html = '';
            shopConfig.forEach(item => {
                let owned = minerCounts[item.id] || 0;
                html += `
                    <div class="card">
                        <div class="card-info">
                            <div class="card-title">${item.name}</div>
                            <div class="card-sub">Tezlik: <strong style="color: #38bdf8;">+${item.cps} koin/sek</strong></div>
                            <div class="card-sub">Narxi: <strong style="color: #f59e0b;">${item.price.toLocaleString()}</strong> koin</div>
                            <div class="card-sub" style="color: #4ade80; margin-top:2px;">Sizda bor: <strong>${owned} dona</strong></div>
                        </div>
                        <button class="btn btn-buy" onclick="buyMiner(${item.id})">Sotib olish</button>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function renderMyMiners() {
            let container = document.getElementById('my_miners_list');
            let hasAnyMiner = false;
            let html = '';

            shopConfig.forEach(item => {
                let count = minerCounts[item.id] || 0;
                if (count > 0) {
                    hasAnyMiner = true;
                    let totalCps = parseFloat((count * item.cps).toFixed(2));
                    html += `
                        <div class="card">
                            <div class="card-info">
                                <div class="card-title">🚜 ${item.name}</div>
                                <div class="card-sub">Soni: <strong style="color: #f59e0b;">${count} dona</strong></div>
                                <div class="card-sub">Umumiy tezlik: <strong style="color: #38bdf8;">+${totalCps} koin/sek</strong></div>
                            </div>
                            <span style="font-size: 11px; background: #334155; padding: 4px 8px; border-radius: 6px; color: #4ade80;">Faol</span>
                        </div>
                    `;
                }
            });

            if (!hasAnyMiner) {
                container.innerHTML = `<div class="balance-card" style="color: #64748b;">Sizda hali hech qanday mayner yo'q. Do'kondan sotib oling!</div>`;
            } else {
                container.innerHTML = html;
            }
        }

        function claimPromo() {
            let code = document.getElementById('promoInput').value.trim().toLowerCase();
            if (!code) {
                alert("Promokodni kiriting!");
                return;
            }

            if (code === 'pull') {
                if (usedPromos.includes('pull')) {
                    alert("Siz bu promokoddan foydalanib bo'lgansiz!");
                } else {
                    balance += 100000;
                    usedPromos.push('pull');
                    saveLocalState();
                    updateDisplay();
                    document.getElementById('promoInput').value = '';
                    alert("Tabriklaymiz! 100,000 koin hisobingizga qo'shildi! 🎉");
                }
            } else {
                alert("Noto'g'ri promokod kiritildi!");
            }
        }

        function initOfflineEarnings() {
            let now = Date.now();
            let totalCps = getTotalCPS();
            if (totalCps > 0 && lastTime > 0) {
                let secondsPassed = Math.floor((now - lastTime) / 1000);
                if (secondsPassed >= 3) {
                    let earned = parseFloat((secondsPassed * totalCps).toFixed(2));
                    balance += earned;
                    updateDisplay();
                    saveLocalState();
                    setTimeout(() => {
                        alert(`Siz yo'qligingizda maynerlaringiz ${earned} koin ishlab berdi! 🚀`);
                    }, 500);
                }
            }
            updateDisplay();
        }

        function saveLocalState() {
            localStorage.setItem('kryze_balance', balance);
            localStorage.setItem('kryze_miner_counts', JSON.stringify(minerCounts));
            localStorage.setItem('kryze_used_promos', JSON.stringify(usedPromos));
            localStorage.setItem('kryze_last_time', Date.now());
        }

        function tapCoin() {
            balance += 1;
            updateDisplay();
            saveLocalState();
        }

        function updateDisplay() {
            document.getElementById('balance').innerText = balance.toFixed(1);
            document.getElementById('cps').innerText = getTotalCPS();
        }

        setInterval(() => {
            let totalCps = getTotalCPS();
            if (totalCps > 0) {
                balance += totalCps;
                updateDisplay();
                saveLocalState();
            }
        }, 1000);

        window.addEventListener('pagehide', saveLocalState);
        window.addEventListener('beforeunload', saveLocalState);

        initOfflineEarnings();
    </script>
</body>
</html>
